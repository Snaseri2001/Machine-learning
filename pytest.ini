[pytest]
# Minimum required pytest version
minversion = 8.0

# Always run with verbose output, concise tracebacks, and strict marker checks
addopts = -v --tb=short --strict-markers

# Directory where pytest searches for tests
testpaths =
    tests

# File naming patterns to discover
python_files = test_*.py *_test.py

# Class naming patterns to discover
python_classes = Test*

# Function/method naming patterns to discover
python_functions = test_*

# Register custom markers (prevents typos and warning messages)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: fast isolated unit tests
    integration: integration tests requiring external dependencies